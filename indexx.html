async function confirmRestart(){if(G.busy)return;const yes=await ask(`<div class="big">↺</div><h2>เริ่มเกมใหม่?</h2><p>ความคืบหน้าของเกมตอนนี้จะหายไปทั้งหมด</p><div class="opts">${ok('✅ ใช่ เริ่มใหม่เลย','yes','r')}${ok('ยกเลิก','',0)}</div>`);if(yes=='yes')setup()}

async function roll(){if(G.busy||G.ph!='roll')return;G.busy=true;const d=$('#die');d.classList.add('roll');const F='⚀⚁⚂⚃⚄⚅';for(let i=0;i<9;i++){d.textContent=F[rn(6)];beep(300+rn(300),.04);await sleep(70)}

${p.menus.map(x=>`<div class="menu ${x.d?'done':ready(p,x.m)?'rdy':''}" style="margin-bottom:6px"><span class="k">${x.m.k} kcal</span><b>${x.d?'✅ ':''}${x.m.n}</b><div class="need">${Object.entries(x.m.need).map(([k,v])=>{const h=Math.min(v,p.inv[k]||0);return `<span class="ch ${h>=v?'ok':''}">${I[k][0]} ${I[k][1]} ${h}/${v}</span>`}).join('')}</div></div>`).join('')}

function needOf(p,k){const tot=p.menus.filter(x=>!x.d).reduce((a,x)=>a+(x.m.need[k]||0),0);return Math.max(0,tot-(p.inv[k]||0))}
async function pick(p,n,title){for(let i=0;i<n;i++){const k=await ask(`<h2>${title}</h2><div>เลือกวัตถุดิบ (${i+1}/${n})</div><button class="btn" type="button" style="margin-top:8px;background:#8e5bd9;box-shadow:0 4px 0 #5f36a3" onclick="const e=document.getElementById('pkMenu');e.style.display=e.style.display=='none'?'block':'none'">📋 ดูการ์ดเมนู / กระเป๋า</button><div id="pkMenu" style="display:none">${menuView(p)}</div><div style="font-size:12px;margin-top:8px">ป้าย <b style="color:#c0392b">ขาด n</b> = ยังขาดอีกกี่ชิ้นเพื่อทำเมนูที่เหลือ</div><div class="pick">${Object.keys(I).map(k=>{const d=needOf(p,k);return `<button style="background:${GC[GR[k]]}" onclick="mr('${k}')">${I[k][0]}<small>${I[k][1]}</small>${d?`<small style="color:#c0392b">ขาด ${d}</small>`:''}</button>`}).join('')}</div>`);if(!k){toast('ปิดหน้าต่างแล้ว');return}give(p,k);toast(`ได้ ${I[k][0]} ${I[k][1]} ×1`);render()}}
const DIST=[0,2,4,6],STEAL=[0,1,2,3],CANDY=[0,120,230,350];
async function attack(){const p=P();if(G.busy||G.ps.length<2||p.atkUsed)return;G.busy=true;render();
const A=[['🌪️','ลมพัดถอย','a',1],['🥷','ขโมยวัตถุดิบ','x',1],['🍬','ป้อนขนม','c',1],['🧊','แช่แข็ง ข้ามตาหน้า','f',3],['🪤','วางกับดักบนช่องนี้','t',1],['🛡️','โล่ป้องกัน (กัน 1 ครั้ง)','s',1]];
const scale={a:1,x:1,c:1};
const a=await ask(`<h2>⚔️ เลือกการโจมตี (ใช้ได้ 1 ครั้ง/ตา · พลัง ⚡${p.en})</h2><p style="font-size:12px">⚡ ยิ่งใช้เยอะ ยิ่งแรง!</p><div class="opts">${A.map(x=>`<button class="btn ${'st'.includes(x[2])?'g':'r'}" ${p.en>=x[3]?'':'disabled'} onclick="mr('${x[2]}')">${x[0]} ${x[1]}${scale[x[2]]?' (⚡1-3)':` · ⚡${x[3]}`}</button>`).join('')}${ok('ยกเลิก','',0)}</div>`);
const d=A.find(x=>x[2]==a);if(!d){G.busy=false;render();return}
let lvl=d[3];
if(scale[a]){const maxL=Math.min(3,p.en);const opts=[1,2,3].filter(l=>l<=maxL);
const eff=a=='a'?DIST.map(v=>v+' ช่อง'):a=='x'?STEAL.map(v=>v+' ชิ้น'):CANDY.map(v=>'+'+v+' kcal');
lvl=+(await ask(`<h2>${d[0]} เลือกพลัง</h2><div class="opts">${opts.map(l=>`<button class="btn ${l==3?'r':l==2?'o':'g'}" onclick="mr(${l})">⚡${l} → ${eff[l]}</button>`).join('')}${ok('ยกเลิก','',0)}</div>`));
if(!lvl){G.busy=false;render();return}}
if(a=='s'){p.en-=1;p.sh=1;p.atkUsed=1;G.msg='🛡️ ตั้งโล่ป้องกันแล้ว'}
else if(a=='t'){p.en-=1;p.atkUsed=1;G.traps[p.pos]=p.i;G.msg='🪤 วางกับดักแล้ว รอเหยื่อ!'}
else{const os=G.ps.filter(q=>q!=p);const i=await ask(`<h2>เลือกเป้าหมาย</h2><div class="opts">${os.map(q=>`<button class="btn" onclick="mr(${q.i})">${q.e} ${q.n}</button>`).join('')}${ok('ยกเลิก','',0)}</div>`);
if(!i&&i!==0||i<0){G.busy=false;render();return}const q=G.ps[i];
p.en-=lvl;p.atkUsed=1;if(q.sh){q.sh=0;beep(200,.3);G.msg=`🛡️ ${q.n} ป้องกันไว้ได้!`}else{beep(150,.3);
if(a=='a')q.pos=(q.pos+T.length-DIST[lvl])%T.length;
if(a=='c')q.extra+=CANDY[lvl];
if(a=='f')q.frz=1;
if(a=='x')for(let j=0;j<STEAL[lvl];j++){const ks=Object.keys(q.inv).filter(k=>q.inv[k]>0);if(ks.length){const k=ks[rn(ks.length)];q.inv[k]--;give(p,k)}}
const lab=a=='a'?DIST[lvl]+' ช่อง':a=='x'?STEAL[lvl]+' ชิ้น':a=='c'?'+'+CANDY[lvl]+' kcal':'ข้ามตา';

<li>1) 🎲 ทอยเต๋าแล้วเดินตามช่อง (ก่อนทอยใช้ ⚡พลังพิเศษได้ 1 ครั้งต่อเกม)</li>
<li>2) ทำตามช่องที่ตก (เก็บวัตถุดิบ ตลาด ขนม ฯลฯ)</li>
<li>3) ถ้าวัตถุดิบครบตามสูตร กด 👨‍🍳 <b>ปรุงอาหาร</b> ได้</li>
<li>4) โจมตีได้ <b>ตาละ 1 ครั้ง</b> แล้วกด ✅ จบตา</li>
<li>🔄 สลับเมนู: เปลี่ยนการ์ดเมนูที่ยังไม่ปรุง แต่ใช้ 1 ตา</li>
</ul>

<h4>🗺️ ช่องบนกระดาน</h4>
<ul>
<li>🍚🍗🥬🍌 ช่องวัตถุดิบ — ได้วัตถุดิบนั้น <b>×2</b></li>
<li>✨ ช่องทอง (เปลี่ยนทุกรอบ) — ได้ <b>×4</b> และ ⚡+1</li>
<li>🏁 START — ผ่านจุดนี้ เลือกวัตถุดิบฟรี 1 ชิ้น</li>
<li>🛒 ตลาด — เลือกวัตถุดิบเอง 2 ชิ้น</li>
<li>🍭 ของหวาน — ถ้ากินได้พลังงานเพิ่ม (+kcal) ถ้าไม่กินได้ ⭐ และ ⚡+1</li>
<li>❓ เหตุการณ์ — สุ่ม: คำถามโภชนาการ/โจทย์คำนวณ kcal (ตอบถูกได้วัตถุดิบ 1 ชิ้น +⚡1), ของขวัญ, แมวขโมย, ออกกำลังกาย (⭐ และเดินเพิ่ม 2 ช่อง), พายุตลาด, ชาร์จ ⚡+3, ทอยอีกครั้ง</li>
<li>เดินไปช่องเดียวกับคู่แข่ง → แอบขโมยวัตถุดิบ 1 ชิ้น</li>
</ul>

<h4>⚔️ พลังโจมตี ⚡</h4>
<p>เริ่มเกมมี ⚡2 · ได้ +1 ทุก 2 ตาที่เล่น · เก็บได้สูงสุด ⚡8 · ใช้ได้ตาละ 1 ครั้ง (ต้องมีผู้เล่น 2 คนขึ้นไป)</p>
<table>
<tr><th>การโจมตี</th><th>⚡1</th><th>⚡2</th><th>⚡3</th></tr>
<tr><td>🌪️ ลมพัดถอย</td><td>2 ช่อง</td><td>4 ช่อง</td><td>6 ช่อง</td></tr>
<tr><td>🥷 ขโมยของ</td><td>1 ชิ้น</td><td>2 ชิ้น</td><td>3 ชิ้น</td></tr>
<tr><td>🍬 ป้อนขนม</td><td>+120 kcal</td><td>+230 kcal</td><td>+350 kcal</td></tr>
</table>
<ul>
<li>🧊 <b>แช่แข็ง</b> (⚡3) — คู่แข่งข้ามตาหน้า</li>
<li>🪤 <b>กับดัก</b> (⚡1) — วางบนช่องที่ยืนอยู่ ผู้เหยียบเสียวัตถุดิบ 2 ชิ้น เจ้าของได้ ⚡+1</li>
<li>🛡️ <b>โล่</b> (⚡1) — กันการโจมตีหรือกับดักได้ 1 ครั้ง</li>
</ul>

<h4>⭐ ดาวสุขภาพ &amp; 🎖️ ภารกิจลับ</h4>
<ul>
<li>ได้ ⭐ จากการปฏิเสธขนมหวาน และออกกำลังกาย — ช่วยลดคะแนน</li>
<li>ภารกิจลับสำเร็จ → ได้โบนัสคะแนน (ดูของตัวเองที่แท็บ 📊)</li>
</ul>

<h4>🏆 จบเกมและคิดคะแนน</h4>
<ul>
<li>เมื่อมีคนปรุงครบ 3 มื้อ คนอื่นเล่นต่อจนถึงตาของเขาอีกครั้ง แล้วจบเกม (หรือครบจำนวนรอบที่กำหนด)</li>
<li><b>คะแนน = ความคลาดเคลื่อนจากเป้า</b> (เกินเป้านับ ×1.5) − ⭐×20 + (มื้อที่ยังไม่ปรุง × 300) − โบนัสภารกิจ</li>
<li><b>คะแนนน้อยที่สุดชนะ!</b></li>
</ul>`;

function calcView(){
return `<h4>🧮 เครื่องคิดพลังงานอาหาร</h4><p>ใส่จำนวนกรัม ระบบคิด kcal ให้ทันที</p>
<div class="hc">
<label>🍚 คาร์บ <input id="hcC" type="number" min="0" inputmode="decimal" value="50"> g × 4</label>
<label>🥩 โปรตีน <input id="hcP" type="number" min="0" inputmode="decimal" value="15"> g × 4</label>
<label>🧈 ไขมัน <input id="hcF" type="number" min="0" inputmode="decimal" value="10"> g × 9</label>
<div class="hres" id="hcR"></div></div>
<div class="hn">💡 ลองใส่โปรตีน 1 g ดู แล้วเปรียบเทียบกับไขมัน 1 g — ไขมันให้พลังงานมากกว่า 2.25 เท่า</div>
<h4>สูตรที่ใช้ในเกม</h4><p>kcal = (คาร์บ × 4) + (โปรตีน × 4) + (ไขมัน × 9)</p>`}
function calcBind(){
const g=id=>Math.max(0,parseFloat(document.getElementById(id).value)||0);
const up=()=>{const c=g('hcC')*4,p=g('hcP')*4,f=g('hcF')*9,t=c+p+f,pc=x=>t?Math.round(x/t*100):0;
document.getElementById('hcR').innerHTML=`คาร์บ ${c} + โปรตีน ${p} + ไขมัน ${f}<br>= <big><b>${t}</b></big> kcal
<div class="hbar"><i style="width:${t?c/t*100:0}%;background:#ffc45e"></i><i style="width:${t?p/t*100:0}%;background:#ff9bab"></i><i style="width:${t?f/t*100:0}%;background:#ffe066"></i></div>
<div style="font-size:12px;margin-top:4px">🟧 คาร์บ ${pc(c)}% · 🟪 โปรตีน ${pc(p)}% · 🟨 ไขมัน ${pc(f)}%</div>`};
['hcC','hcP','hcF'].forEach(id=>document.getElementById(id).addEventListener('input',up));up()}

function statusView(){
if(typeof G==='undefined'||!G.ps||!G.ps.length||G.ph==='setup')return '<div class="hn">ยังไม่ได้เริ่มเกม — เลือกจำนวนผู้เล่นก่อนนะ</div>';
const p=G.ps[G.cur],tot=p.kcal+p.extra,left=p.t-tot;
const todo=p.menus.filter(x=>!x.d),plus=todo.reduce((a,x)=>a+x.m.k,0),proj=tot+plus;
return `<h4>${p.e} ตาของ ${p.n} · รอบ ${G.round}/${MAXR}</h4>
<div class="hst">🎯 เป้าหมาย <b>${p.t} kcal</b><br>ตอนนี้ได้ <b>${tot} kcal</b> ${p.extra?`(รวมขนม +${p.extra})`:''}
<div class="hb"><b style="width:${Math.min(100,tot/p.t*100)}%;${tot>p.t?'background:#ff6b81':''}"></b></div>
${left>=0?`ยังขาดอีก <b>${left}</b> kcal`:`<span style="color:#e0552b">เกินเป้า <b>${-left}</b> kcal</span>`}</div>
<div class="hst"><b>📋 เมนู</b>${p.menus.map(x=>`<div>${x.d?'✅':'⬜'} ${x.m.n} — ${x.m.k} kcal</div>`).join('')}
<div style="margin-top:4px">ถ้าปรุงครบทุกเมนู ≈ <b>${proj} kcal</b> ${Math.abs(proj-p.t)<=60?'👍 ใกล้เป้ามาก':proj>p.t?'⚠️ เกินเป้า '+(proj-p.t):'ต่ำกว่าเป้า '+(p.t-proj)}</div></div>
<div class="hst">⚡ พลัง <b>${p.en}</b> · ⭐ ดาว <b>${p.stars}</b> · 🍽️ ปรุงแล้ว <b>${p.cooked}/3</b> ${p.sh?'· 🛡️ มีโล่':''} ${p.frz?'· 🧊 ถูกแช่แข็ง':''}<br>⚡ พลังพิเศษ: ${p.ab?p.abt:'ใช้ไปแล้ว'}<br>🎖️ ภารกิจลับ: ${p.mis.t} ${p.mis.f(p)?'<b style="color:#3a8d46">(ตอนนี้ผ่านเกณฑ์ ✅)</b>':''}</div>
<div class="hn">⚖️ ทบทวน: คาร์บ/โปรตีน 1 g = 4 kcal · ไขมัน 1 g = 9 kcal</div>`}

function show(t){cur=t;
tabs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
const y=body.scrollTop;
if(t==='k')body.innerHTML=KNOW;
else if(t==='r')body.innerHTML=RULES;
else if(t==='c'){body.innerHTML=calcView();calcBind()}
else body.innerHTML=statusView();
body.scrollTop=(t==='s')?y:0}
function open_(){ov.classList.add('on');show(cur);clearInterval(timer);timer=setInterval(()=>{if(cur==='s'&&ov.classList.contains('on'))show('s')},800)}
function close_(){ov.classList.remove('on');clearInterval(timer)}
fab.addEventListener('click',open_);
document.getElementById('helpX').addEventListener('click',close_);
ov.addEventListener('click',e=>{if(e.target===ov)close_()});
tabs.addEventListener('click',e=>{const b=e.target.closest('button');if(b)show(b.dataset.t)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ov.classList.contains('on'))close_()});
})();
</script>
</body></html>
